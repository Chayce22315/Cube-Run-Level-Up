name: Build iOS App (Unsigned)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Install Homebrew
      run: |
        /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
        echo 'eval "$(/opt/homebrew/bin/brew shellenv)"' >> ~/.zshrc
        eval "$(/opt/homebrew/bin/brew shellenv)"
    
    - name: Install XcodeGen
      run: brew install xcodegen
    
    - name: Select Xcode
      run: |
        sudo xcode-select --reset
        xcodebuild -version
    
    - name: Extract ZIP
      run: |
        unzip CubeRunLevelUp.zip -d CubeRunLevelUp
        ls -la CubeRunLevelUp/
        # Check if project.yml is inside the extracted folder
        find CubeRunLevelUp -name "project.yml" -type f
    
    - name: Move project.yml to Root (if needed)
      run: |
        # If project.yml is inside the CubeRunLevelUp folder, move it to the root
        if [ -f "CubeRunLevelUp/project.yml" ]; then
          echo "Moving project.yml to root..."
          cp CubeRunLevelUp/project.yml .
        elif [ -f "CubeRunLevelUp/CubeRunLevelUp/project.yml" ]; then
          echo "Moving nested project.yml to root..."
          cp CubeRunLevelUp/CubeRunLevelUp/project.yml .
        elif [ -f "project.yml" ]; then
          echo "project.yml already at root!"
        else
          echo "ERROR: project.yml not found anywhere!"
          find . -name "project.yml" -type f
          exit 1
        fi
        ls -la project.yml
    
    - name: Generate Xcode Project
      run: |
        # Run xcodegen at the root where project.yml is located
        xcodegen generate
    
    - name: Build .app (Unsigned)
      run: |
        # Build from the generated .xcodeproj
        xcodebuild -project CubeRunLevelUp.xcodeproj \
          -scheme CubeRunLevelUp \
          -destination 'generic/platform=iOS' \
          -derivedDataPath build \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          build
    
    - name: Find .app and Create Payload
      run: |
        # Find the .app file
        APP_PATH=$(find . -name "*.app" -type d | head -n 1)
        echo "Found .app at: $APP_PATH"
        
        mkdir -p Payload
        cp -R "$APP_PATH" Payload/
    
    - name: Zip to IPA
      run: |
        zip -r CubeRunLevelUp.ipa Payload/
    
    - name: Upload IPA (Unsigned)
      uses: actions/upload-artifact@v4
      with:
        name: CubeRunLevelUp.ipa
        path: CubeRunLevelUp.ipa
    
    - name: Upload .app (for debugging)
      uses: actions/upload-artifact@v4
      with:
        name: CubeRunLevelUp.app
        path: Payload/CubeRunLevelUp.app
